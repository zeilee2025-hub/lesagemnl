<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ADMIN LOGIN • LÉ SAGE MNL</title>

  <link
    rel="stylesheet"
    href="./css/base.css"
  />

  <link
    rel="stylesheet"
    href="./css/pages/admin-login.css"
  />

  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./site.webmanifest" />
</head>

<body class="admin-login-page">

  <main class="admin-login">

    <section
      class="admin-login__card"
      aria-labelledby="admin-login-title"
    >

      <div class="admin-login__header">

        <p class="admin-login__eyebrow">
          LÉ SAGE ADMIN
        </p>

        <h1
          class="admin-login__title"
          id="admin-login-title"
        >
          Sign in
        </h1>

        <p class="admin-login__text">
          Restricted access for authorized administrators.
        </p>

      </div>

      <div class="admin-login__form">

        <label
          class="admin-login__field"
          for="admin-email"
        >
          <span>Email</span>

          <input
            type="email"
            id="admin-email"
            class="admin-login__input"
            placeholder="Admin Email"
            autocomplete="email"
          />
        </label>

        <label
          class="admin-login__field"
          for="admin-password"
        >
          <span>Password</span>

          <input
            type="password"
            id="admin-password"
            class="admin-login__input"
            placeholder="Password"
            autocomplete="current-password"
          />
        </label>

        <p
          class="admin-login__error"
          id="admin-login-error"
          aria-live="polite"
        ></p>

        <button
          id="admin-login-btn"
          class="admin-login__button"
        >
          Sign in
        </button>

      </div>

    </section>

  </main>

  <script
    type="module"
    src="./js/pages/admin-login.js"
  ></script>

</body>

</html>
